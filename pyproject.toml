[project]
name = "atlas"
version = "0.1.0"
description = "Cash flow forecasting and customer segmentation agent"
requires-python = ">=3.12"
dependencies = [
    # Core data
    "polars>=1.44.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",          # statsforecast requires pandas

    # ML / forecasting
    "scikit-learn>=1.9.0",
    "statsforecast>=1.7.0",
    "statsmodels>=0.15.0",
    "scipy>=1.18.1",

    # Clustering
    "hdbscan>=0.8.44",

    # LangGraph / Anthropic
    "langgraph>=1.2.11",
    "anthropic>=0.121.0",

    # Knowledge graph
    "neo4j>=6.3.0",

    # API
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",

    # Reporting
    "rich>=13.0.0",
    "matplotlib>=3.9.0",      # evals/reports/figures.py SVG panels

    # HTTP
    "httpx>=0.27.0",

    # Crypto
    "ccxt>=4.5.78",
]

[project.optional-dependencies]
chronos = [
    "torch>=2.14.0",
    "chronos-forecasting>=2.3.2",
]
tsfresh = [
    "tsfresh>=0.21.2",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.16.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "N803", "N806"]

[tool.hatch.build.targets.wheel]
packages = ["core", "src", "evals", "api", "pipelines"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
